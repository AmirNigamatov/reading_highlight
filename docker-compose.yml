version: '3.8'

services:
  highlight-app:
    build: .
    image: highlight-app:latest
    container_name: highlight-app
    working_dir: /src/src
    volumes:
      - ./data:/src/data
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "main.py", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  app-network:
    driver: bridge
