name: CI
on:
  pull_request:
  push:
    branches: [main, stage]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint & Format
        run: |
          ruff check --output-format=github .
          black --check .
          isort --check-only .

      - name: Tests
        run: |
          pytest -q --junitxml=reports/junit.xml --cov=./ --cov-report=xml:reports/coverage.xml

      - name: Pre-commit (all files)
        run: pre-commit run --all-files

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            reports/junit.xml
            reports/coverage.xml
          retention-days: 7

      - name: Check Secret Availability (Example)
        run: |
          if [ -n "${{ secrets.API_KEY }}" ]; then
            echo "Secret API_KEY is available and masked in logs."
          else
            echo "Secret API_KEY not set."
          fi

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy

      - name: Run Trivy vulnerability scan
        run: |
          trivy fs --format sarif --output trivy-results.sarif --severity HIGH,CRITICAL .

      - name: Upload Trivy Scan Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  stage-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/stage'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies (production)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Application (Emulation/Probe Run)
        run: |
          python main.py list
          echo "Stage deploy emulation successful."

      - name: Upload Stage Logs (Optional)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-logs
          path: |
            data.json
          retention-days: 7
