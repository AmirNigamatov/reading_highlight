name: CI
on:
  pull_request:
  push:
    branches: [main, stage]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies (test)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest tests/ --verbose --junitxml=pytest.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: pytest.xml
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  stage-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/stage'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies (production)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Secret Availability
        run: |
          if [ -n "${{ secrets.MY_SECRET }}" ]; then
            echo "Secret MY_SECRET is available (length: ${#secrets.MY_SECRET})."
          else
            echo "Secret MY_SECRET not set or empty."
            exit 1
          fi

      - name: Run Application (Emulation/Probe Run) with Secret
        env:
          MY_API_KEY: ${{ secrets.MY_SECRET }}
        run: |
          echo "Using secret for deployment simulation..."
          python main.py list
          echo "Stage deploy emulation successful with secret."

      - name: Upload Stage Logs (Optional)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-logs
          path: |
            data.json
          retention-days: 7
