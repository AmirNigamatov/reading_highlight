name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint & Format
        run: |
          ruff check --output-format=github .
          black --check .
          isort --check-only .

      - name: Tests
        run: |
          pytest -q --junitxml=reports/junit.xml --cov=./ --cov-report=xml:reports/coverage.xml

      - name: Pre-commit (all files)
        run: pre-commit run --all-files

      - name: Use Secret
        run: |
          if [ -n "${{ secrets.MY_SECRET }}" ]; then
            echo "Secret is set and masked: ${{ secrets.MY_SECRET }}"
          else
            echo "Secret MY_SECRET is not set"
          fi


      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            reports/junit.xml
            reports/coverage.xml
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy

      - name: Run Trivy vulnerability scan
        run: |
          trivy fs --format sarif --output trivy-results.sarif --severity HIGH,CRITICAL .

      - name: Upload Trivy Scan Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build, security]  # Зависит от успешного CI
    if: github.ref == 'refs/heads/main'  # Только на push в main (для staging)
    steps:
      - uses: actions/checkout@v4
      - name: Log CI Completion Proof
        run: |
          echo "CI jobs completed successfully. Proceeding to CD."
          echo "Build status: ${{ needs.build.result }}"
          echo "Security status: ${{ needs.security.result }}"
      - name: Mock Build Image
        run: echo "Building application image for staging..."
      - name: Mock Push to Staging
        run: |
          echo "Pushing to staging environment..."
          echo "Deployment timestamp: $(date)"
          echo "Staging URL: http://staging.example.com"
      - name: Create Deployment Proof Artifact
        run: |
          echo "Proof of staging deploy:" > deployment-proof.txt
          echo "Timestamp: $(date)" >> deployment-proof.txt
          echo "Commit: ${{ github.sha }}" >> deployment-proof.txt
          echo "Triggered by: ${{ github.actor }}" >> deployment-proof.txt
          echo "Status: Mock staging deploy completed." >> deployment-proof.txt
          cat deployment-proof.txt
      - uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-proof
          path: deployment-proof.txt
